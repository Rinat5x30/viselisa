services:
  - type: web
    name: toptop
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn backend_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "toptop.az"
      - key: SITE_DOMAIN
        value: "toptop.az"
      - key: PYTHON_VERSION
        value: "3.12.10"
